<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>세계 축제 지리 탐험</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #14181f;
      --muted: #4a5363;
      --line: #d9dee8;
      --accent: #1f5eff;
      --asia: #d9480f;
      --europe: #1c7ed6;
      --america: #2b8a3e;
      --africa: #9c6500;
      --oceania: #0b7285;
      --sea: #dcebfa;
      --land: #e9e4d4;
      --land-line: #b9b09a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
      font-size: 20px;
      line-height: 1.6;
    }

    header {
      max-width: 1240px;
      margin: 0 auto;
      padding: 32px 24px 8px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 40px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      margin: 0 0 20px;
      color: var(--muted);
    }

    /* 대륙 필터 */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .filters button {
      font: inherit;
      font-weight: 700;
      padding: 10px 22px;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }

    .filters button:hover { border-color: var(--accent); }

    .filters button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .filters .count {
      font-weight: 400;
      opacity: 0.75;
      margin-left: 4px;
    }

    main {
      max-width: 1240px;
      margin: 0 auto;
      padding: 20px 24px 48px;
    }

    /* 세계지도 */
    .map-box {
      margin-bottom: 24px;
      padding: 16px;
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 16px;
    }

    .map-box h2 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .map-box .hint {
      margin-left: 8px;
      font-size: 17px;
      font-weight: 400;
      color: var(--muted);
    }

    .world {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
    }

    .world .sea { fill: var(--sea); }
    .world .land { fill: var(--land); stroke: var(--land-line); stroke-width: 0.8; stroke-linejoin: round; }
    .world .water { fill: var(--sea); stroke: var(--land-line); stroke-width: 0.8; }
    .world .lat-line { stroke: #7a8aa6; stroke-width: 1; stroke-dasharray: 6 5; }
    .world .lat-line.equator { stroke: #c92a2a; stroke-dasharray: none; stroke-width: 1.4; }
    .world .lat-label { font-size: 13px; fill: #4a5363; font-weight: 700; }
    .world .lat-label.equator { fill: #c92a2a; }

    .marker { cursor: pointer; }
    .marker .dot { stroke: #fff; stroke-width: 1.5; }
    .marker .leader { stroke-width: 2; }
    .marker .badge { stroke: #fff; stroke-width: 2.5; }
    .marker text {
      font-size: 14px;
      font-weight: 800;
      fill: #fff;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }
    .marker:hover .badge, .marker:focus-visible .badge { stroke: var(--text); }
    .marker:focus { outline: none; }

    .pulse {
      fill: none;
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse 1.6s ease-out infinite;
    }

    @keyframes pulse {
      from { transform: scale(0.4); opacity: 1; }
      to { transform: scale(2.2); opacity: 0; }
    }

    /* 축제 카드 목록 */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 18px;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      padding: 20px;
      font: inherit;
      text-align: left;
      color: inherit;
      background: var(--card);
      border: 2px solid var(--line);
      border-top: 8px solid var(--continent-color);
      border-radius: 16px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .card:hover, .card:focus-visible {
      transform: translateY(-4px);
      box-shadow: 0 10px 24px rgba(20, 24, 31, 0.12);
      outline: none;
    }

    .rank {
      font-size: 18px;
      font-weight: 800;
      color: var(--continent-color);
    }

    .card .emoji { font-size: 52px; line-height: 1.2; }

    .card .name {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.3;
    }

    .card .meta { color: var(--muted); font-size: 18px; }

    .empty {
      grid-column: 1 / -1;
      padding: 48px;
      text-align: center;
      color: var(--muted);
      background: var(--card);
      border: 2px dashed var(--line);
      border-radius: 16px;
    }

    /* 상세 창 */
    dialog {
      width: min(960px, calc(100vw - 48px));
      max-height: calc(100vh - 32px);
      padding: 0;
      border: none;
      border-radius: 20px;
      color: var(--text);
      background: var(--card);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
    }

    dialog::backdrop { background: rgba(10, 14, 22, 0.6); }

    .detail-head {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 28px;
      border-bottom: 8px solid var(--continent-color);
    }

    .detail-head .emoji { font-size: 56px; line-height: 1; }

    .detail-head .rank { font-size: 20px; }

    .detail-head h2 {
      margin: 0;
      font-size: 34px;
      line-height: 1.25;
    }

    .close {
      margin-left: auto;
      align-self: flex-start;
      font: inherit;
      font-weight: 700;
      padding: 8px 18px;
      border: 2px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }

    .close:hover { border-color: var(--accent); }

    .detail-body { padding: 8px 28px 24px; }

    .detail-top {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 24px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }

    .mini-map .world { border: 1px solid var(--line); }

    .rows { margin: 0; }

    .row {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }

    .row:last-child { border-bottom: none; }

    .row dt { font-weight: 800; }

    .row dd { margin: 0; font-size: 21px; }

    .season-tag {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 12px;
      font-size: 17px;
      font-weight: 700;
      border-radius: 999px;
      background: #eef2ff;
      color: var(--accent);
    }

    .season-tag.south { background: #fff4e6; color: #c2410c; }

    .question dd {
      padding: 14px 18px;
      font-weight: 700;
      background: #fff9db;
      border-radius: 12px;
    }

    .answer-btn {
      display: block;
      margin-top: 12px;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      padding: 8px 18px;
      border: 2px solid #e0b100;
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
    }

    .answer-btn:hover { background: #fff3bf; }

    .answer {
      margin-top: 12px;
      padding: 14px 18px;
      font-weight: 400;
      background: #fff;
      border-left: 6px solid #2b8a3e;
      border-radius: 8px;
    }

    .answer strong { color: #2b8a3e; }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 16px;
      padding-bottom: 32px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🌍 세계 축제 지리 탐험</h1>
    <p class="subtitle">유명한 축제 순서대로 · 지도의 번호나 카드를 누르면 위치, 시기, 자연·문화 배경을 볼 수 있어요</p>
    <nav class="filters" id="filters" aria-label="대륙 필터"></nav>
  </header>

  <main>
    <section class="map-box">
      <h2>🗺️ 세계 축제 지도 <span class="hint">번호 = 유명한 순위 · 누르면 자세히 보기</span></h2>
      <div id="world-map"></div>
    </section>

    <div class="grid" id="grid"></div>
  </main>

  <footer>Esc 키 또는 창 바깥을 누르면 상세 창이 닫혀요 · 지도는 수업용으로 간략하게 그린 것이에요</footer>

        ${latLine(-23.44, "남회귀선")}`;
    }

    // 번호 표시가 겹치지 않도록 빈 자리를 찾아 옮겨 놓기
    const OFFSETS = [[0, 0], [0, -30], [30, 0], [-30, 0], [0, 30], [26, -26], [-26, -26], [26, 26], [-26, 26], [0, -56], [56, 0], [-56, 0]];

    function renderWorldMap() {
      const placed = [];
      const markers = visibleFestivals().map(f => {
        const x = px(f.lon), y = py(f.lat);
        const [dx, dy] = OFFSETS.find(([dx, dy]) =>
          placed.every(p => Math.hypot(p.x - (x + dx), p.y - (y + dy)) > 28)
        ) || [0, 0];
        const bx = x + dx, by = y + dy;
        placed.push({ x: bx, y: by });
        const color = continentColor(f.continent);
        const leader = dx || dy
          ? `<line class="leader" x1="${x}" y1="${y}" x2="${bx}" y2="${by}" stroke="${color}"></line>
             <circle class="dot" cx="${x}" cy="${y}" r="5" fill="${color}"></circle>`
          : "";
        return `
          <g class="marker" data-rank="${f.rank}" tabindex="0" role="button" aria-label="${f.rank}위 ${f.name}">
            <title>${f.rank}위 ${f.name} (${f.country})</title>
            ${leader}
            <circle class="badge" cx="${bx}" cy="${by}" r="14" fill="${color}"></circle>
            <text x="${bx}" y="${by}">${f.rank}</text>
          </g>`;
      }).join("");

      worldMap.innerHTML = `
        <svg class="world" viewBox="0 0 ${MAP_W} ${MAP_H}" role="img" aria-label="세계 축제 위치 지도">
          ${baseMapSvg()}
          ${markers}
        </svg>`;

      worldMap.querySelectorAll(".marker").forEach(m => {
        const f = FESTIVALS[m.dataset.rank - 1];
        const open = () => openDetail({ ...f, rank: Number(m.dataset.rank) });
        m.addEventListener("click", open);
        m.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
      });
    }

    // 상세 창의 작은 지도: 해당 축제 위치만 크게 표시
    function miniMapSvg(f) {
      const x = px(f.lon), y = py(f.lat);
      const color = continentColor(f.continent);
      return `
        <svg class="world" viewBox="0 0 ${MAP_W} ${MAP_H}" role="img" aria-label="${f.name} 위치 지도">
          ${baseMapSvg()}
          <circle class="pulse" cx="${x}" cy="${y}" r="40" stroke="${color}" stroke-width="8"></circle>
          <circle cx="${x}" cy="${y}" r="26" fill="${color}" stroke="#fff" stroke-width="8"></circle>
        </svg>`;
    }

    function renderFilters() {
      filters.innerHTML = "";
      CONTINENTS.forEach(c => {
        const count = c.name === "전체"
          ? FESTIVALS.length
          : FESTIVALS.filter(f => f.continent === c.name).length;
        const btn = document.createElement("button");
        btn.innerHTML = `${c.name}<span class="count">${count}</span>`;
        btn.className = c.name === currentFilter ? "active" : "";
        btn.addEventListener("click", () => {
          currentFilter = c.name;
          renderAll();
        });
        filters.appendChild(btn);
      });
    }

    function renderGrid() {
      grid.innerHTML = "";
      // 순위는 전체 배열 기준이라, 필터를 걸어도 원래 순위 번호가 그대로 보여요.
      const list = visibleFestivals();

      if (list.length === 0) {
        grid.innerHTML = `<div class="empty">아직 ${currentFilter} 축제가 없어요.<br>index.html의 FESTIVALS 배열에 추가해 보세요.</div>`;
        return;
      }

      list.forEach(f => {
        const card = document.createElement("button");
        card.className = "card";
        card.style.setProperty("--continent-color", continentColor(f.continent));
        card.innerHTML = `
          <span class="rank">${f.rank}위</span>
          <span class="emoji">${f.emoji}</span>
          <span class="name">${f.name}</span>
          <span class="meta">${f.country} · ${f.months}</span>
        `;
        card.addEventListener("click", () => openDetail(f));
        grid.appendChild(card);
      });
    }

    function openDetail(f) {
      const south = f.hemisphere === "남";
      const seasonTag = south
        ? `<span class="season-tag south">남반구 · ${f.season} (북반구와 계절이 반대)</span>`
        : `<span class="season-tag">북반구 · ${f.season}</span>`;

      detail.style.setProperty("--continent-color", continentColor(f.continent));
      detail.innerHTML = `
        <div class="detail-head">
          <span class="emoji">${f.emoji}</span>
          <div>
            <div class="rank">${f.rank}위 · ${f.continent}</div>
            <h2>${f.name}</h2>
          </div>
          <button class="close" id="close-btn">닫기 ✕</button>
        </div>
        <div class="detail-body">
          <div class="detail-top">
            <div class="mini-map">${miniMapSvg(f)}</div>
            <dl class="rows">
              <div class="row"><dt>📍 위치</dt><dd>${f.continent} · ${f.country}<br>${f.city}</dd></div>
              <div class="row"><dt>📅 시기</dt><dd>${f.months}<br>${seasonTag}</dd></div>
            </dl>
          </div>
          <dl class="rows">
            <div class="row"><dt>🌏 배경</dt><dd>${f.background}</dd></div>
            <div class="row question"><dt>💬 질문</dt>
              <dd>
                ${f.question}
                <button class="answer-btn" id="answer-btn">💡 정답 보기</button>
                <div class="answer" id="answer" hidden><strong>정답</strong> ${f.answer}</div>
              </dd>
            </div>
          </dl>
        </div>
      `;
      document.getElementById("close-btn").addEventListener("click", () => detail.close());
      const answerBtn = document.getElementById("answer-btn");
      const answer = document.getElementById("answer");
      answerBtn.addEventListener("click", () => {
        answer.hidden = !answer.hidden;
        answerBtn.textContent = answer.hidden ? "💡 정답 보기" : "🙈 정답 숨기기";
        if (!answer.hidden) answer.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });
      detail.showModal();
      detail.scrollTop = 0;
    }

    // 창 바깥(어두운 배경)을 누르면 닫기
    detail.addEventListener("click", e => {
      if (e.target === detail) detail.close();
    });

    function renderAll() {
      renderFilters();
      renderWorldMap();
      renderGrid();
    }

    renderAll();
  </script>
</body>
</html>
